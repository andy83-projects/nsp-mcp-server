name: Build and logic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build companion skill ZIP
        run: python3 scripts/build_skill_package.py --version "0.1.0-ci.$GITHUB_RUN_NUMBER"
      - name: Check archive integrity
        run: python3 -m zipfile -t "out/releases/haltech-nsp-skill-0.1.0-ci.$GITHUB_RUN_NUMBER.zip"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/Nsp.Mcp.Tools.Tests --no-build -c Release --logger trx --results-directory TestResults
      - run: dotnet test tests/Nsp.Automation.Tests --no-build -c Release --logger trx --results-directory TestResults
      - run: dotnet publish src/Nsp.Mcp.Server --no-restore -c Release -o out/server --self-contained false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
