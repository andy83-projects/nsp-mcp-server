name: Build and logic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/Nsp.Mcp.Tools.Tests --no-build -c Release --logger trx --results-directory TestResults
      - run: dotnet test tests/Nsp.Automation.Tests --no-build -c Release --logger trx --results-directory TestResults
      - run: dotnet publish src/Nsp.Mcp.Server --no-restore -c Release -o out/server --self-contained false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
